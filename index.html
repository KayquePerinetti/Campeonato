<head>

<style>

<body>

<!--<img src="original android.gif" alt="">-->
    
<div class="container">

<h1>Tabela de Classificação</h1>

<div class="botoes">
<button onclick="gerarPDF()">📄 Baixar PDF</button>
<!--<a class="link" href="https://drive.google.com/file/d/1lTfuJZbgvVijP-mnccCNxMyTgwsU_tqI/view?usp=drivesdk">Regulamento</a>-->
<a class="link" href="https://kayqueperinetti.github.io/Campeoes/">Campeões</a>
</div>

<table id="tabela">
<thead>
<tr>
    <th>Posição</th>
    <th>Nome</th>
    <th>Pontos</th>
    <th>Jogos</th>
    <th>Vitórias</th>
    <th>Empates</th>
    <th>Derrotas</th>
    <th>Data Nasc.</th>
    <th>Idade</th>
</tr>
</thead>

<tbody id="corpoTabela"></tbody>

</table>

<div class="rodape">
Última atualização: 11/09/2026 às 09:35.

</div>
<small>Kayque Perinetti Cardoso &reg;</small>
</div>

<script>

// =========================================
// ADICIONE OS JOGADORES DIRETO NO CÓDIGO
// =========================================

const jogadores = [

{
nome:"Jota",
vitorias:0,
empates:0,
derrotas:0,
nascimento:"26/08/2001"
},
    {
nome:"Junior Mariano",
vitorias:0,
empates:0,
derrotas:0,
nascimento:"28/02/1996"
},
        {
nome:"Nathan Brian",
vitorias:0,
empates:0,
derrotas:0,
nascimento:"27/05/1999"
},
];

// =========================================

function calcularIdade(dataBR){

const partes = dataBR.split("/");
const nascimento = new Date(
partes[2],
partes[1]-1,
partes[0]
);

const hoje = new Date();

let idade = hoje.getFullYear() - nascimento.getFullYear();

const mes = hoje.getMonth() - nascimento.getMonth();

if(
mes < 0 ||
(mes === 0 && hoje.getDate() < nascimento.getDate())
){
idade--;
}

return idade;
}

function carregarTabela(){

jogadores.forEach(j => {

    j.pontos = (j.vitorias * 3) + j.empates;

    // Jogos calculados automaticamente
    j.jogos = j.vitorias + j.empates + j.derrotas;

    j.idade = calcularIdade(j.nascimento);

});

jogadores.sort((a,b)=> b.pontos - a.pontos);

const tbody = document.getElementById("corpoTabela");
tbody.innerHTML = "";

jogadores.forEach((j,index)=>{

let classe = "";

if(index === 0){
classe = "primeiro";
}
else if(index >= jogadores.length - 3){
classe = "rebaixado";
}

tbody.innerHTML += `
<tr class="${classe}">
    <td>${index+1}</td>
    <td>${j.nome}</td>
    <td>${j.pontos}</td>
    <td>${j.jogos}</td>
    <td>${j.vitorias}</td>
    <td>${j.empates}</td>
    <td>${j.derrotas}</td>
    <td>${j.nascimento}</td>
    <td>${j.idade}</td>
</tr>
`;

});}


function gerarPDF(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF("landscape");

doc.setFillColor(30,41,59);
doc.rect(0,0,300,25,'F');

doc.setTextColor(255,255,255);
doc.setFontSize(20);
doc.text("Tabela de Classificação",15,16);

const linhas = [];

jogadores.forEach((j,index)=>{

linhas.push([
    index+1,
    j.nome,
    j.pontos,
    j.jogos,
    j.vitorias,
    j.empates,
    j.derrotas,
    j.nascimento,
    j.idade
]);

});

doc.autoTable({

startY:35,

head:[[
    "Posição",
    "Nome",
    "Pontos",
    "Jogos",
    "Vitórias",
    "Empates",
    "Derrotas",
    "Nascimento",
    "Idade"
]],

body:linhas,

headStyles:{
fillColor:[30,41,59]
},

alternateRowStyles:{
fillColor:[240,240,240]
},

didParseCell:function(data){

if(data.section === 'body'){

if(data.row.index === 0){
data.cell.styles.fillColor = [200,247,197];
}

if(data.row.index >= jogadores.length-3){
data.cell.styles.fillColor = [255,214,214];
}

}

}

});

doc.save("classificacao.pdf");

}

carregarTabela();

</script>

</body>
</html>
